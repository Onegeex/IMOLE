[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# QIE mainnet is not at Cancun: PUSH0 works, MCOPY/TSTORE do not.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
qie_mainnet = "https://rpc1mainnet.qie.digital"
qie_testnet = "https://rpc1testnet.qie.digital"

[invariant]
runs = 256
depth = 60
fail_on_revert = false
